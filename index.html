<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gantt SPQM-1 - Query Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#0d1117;color:#e6edf3;font-size:13px}
a{color:#58a6ff;text-decoration:none}
.head{padding:14px 20px;background:#161b22;border-bottom:1px solid #30363d}
.h1{font-size:18px;font-weight:700}
.sub{font-size:11px;color:#8b949e;margin-top:3px}
.kpi{display:flex;gap:10px;padding:10px 20px;background:#161b22;border-bottom:1px solid #30363d;align-items:center;flex-wrap:wrap}
.card{background:#21262d;padding:8px 14px;border-radius:8px;min-width:100px;text-align:center}
.card b{font-size:20px;display:block}
.ok{color:#3fb950}.pr{color:#388bfd}.td{color:#8b949e}
.main{padding:14px 20px}
.sec{margin-bottom:22px}
.sct{font-size:12px;font-weight:600;color:#8b949e;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.legend{font-size:10px;color:#8b949e;margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ldot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #21262d;padding:5px 7px;text-align:left;white-space:nowrap;vertical-align:middle}
th{color:#8b949e;background:#161b22;font-size:11px;font-weight:500}
.tname{max-width:240px;overflow:hidden;text-overflow:ellipsis}
.town{max-width:120px}
.tdate{font-size:10px;color:#8b949e}
.badge{padding:2px 7px;border-radius:10px;font-size:10px}
.badge.done{background:#163621;color:#3fb950}
.badge.prog{background:#122f53;color:#58a6ff}
.badge.todo{background:#2f343d;color:#8b949e}
.barcell{min-width:420px;padding:0 4px}
.track{position:relative;height:28px;background:#161b22;border-radius:3px}
.bar.planned{position:absolute;top:4px;height:8px;border-radius:4px;z-index:3;opacity:.85}
.wl-bar{position:absolute;top:16px;height:6px;border-radius:3px;background:#79c0ff;opacity:.9;z-index:3}
.today-inner{position:absolute;top:-3px;bottom:-3px;width:2px;background:#f85149;z-index:5;border-radius:1px}
.tick-header{position:relative;height:16px;min-width:420px;margin:0 4px 2px}
.tick-header span{position:absolute;font-size:9px;color:#484f58;transform:translateX(-50%);white-space:nowrap}
.warn{padding:12px 20px;color:#f0883e}
@media (max-width:900px){
  .barcell,.tick-header{min-width:300px}
}
</style>
</head>
<body>
<div class="head">
  <div id="title" class="h1">SPQM-1 - Query Manager per Service Desk</div>
  <div id="subtitle" class="sub"></div>
</div>
<div id="kpi" class="kpi"></div>
<div class="main">
  <div class="legend">
    <span><span class="ldot" style="background:#3fb950"></span>Pianificato: Fatto</span>
    <span><span class="ldot" style="background:#388bfd"></span>Pianificato: In corso</span>
    <span><span class="ldot" style="background:#6e7681"></span>Pianificato: Da fare</span>
    <span><span class="ldot" style="background:#79c0ff;height:6px"></span>Worklog reale</span>
    <span><span class="ldot" style="background:#f85149;width:2px;border-radius:0"></span>Oggi</span>
    <span style="margin-left:8px">Stimato/Registrato: <span style="color:#3fb950">verde</span>=in linea <span style="color:#f0883e">arancione</span>=sforamento</span>
    <span style="margin-left:8px">Rimanente: <span style="color:#8b949e">grigio</span>=da fare <span style="color:#3fb950">verde</span>=completato</span>
  </div>
  <div id="content"></div>
</div>
<div id="warn" class="warn" style="display:none"></div>
<script>
const DATA_URL = "data/gantt-data.json";

function parseDateDDMM(value, fallbackYear) {
  if (!value) return null;
  const m = value.match(/^(\d{2})\/(\d{2})(?:\/(\d{4}))?$/);
  if (!m) return null;
  const d = Number(m[1]);
  const mo = Number(m[2]) - 1;
  const y = m[3] ? Number(m[3]) : fallbackYear;
  return new Date(y, mo, d);
}

function fmtDate(d) {
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return `${dd}/${mm}`;
}

function pct(date, start, end) {
  const full = end - start;
  if (full <= 0) return 0;
  const p = ((date - start) / full) * 100;
  return Math.max(0, Math.min(100, p));
}

function statusBadge(status) {
  if (status === "Fatto") return "done";
  if (status === "In corso") return "prog";
  return "todo";
}

function statusColor(status) {
  if (status === "Fatto") return "#3fb950";
  if (status === "In corso") return "#388bfd";
  return "#6e7681";
}

function kpi(tasks) {
  const done = tasks.filter(t => t.status === "Fatto").length;
  const prog = tasks.filter(t => t.status === "In corso").length;
  const todo = tasks.filter(t => t.status !== "Fatto" && t.status !== "In corso").length;
  const total = tasks.length;
  return {done, prog, todo, total};
}

function collectRange(tasks, year, today) {
  const dates = [today];
  for (const t of tasks) {
    const ps = parseDateDDMM(t.planStart, year);
    const pe = parseDateDDMM(t.planEnd, year);
    if (ps) dates.push(ps);
    if (pe) dates.push(pe);
  }
  const min = new Date(Math.min(...dates.map(d => d.getTime())));
  const max = new Date(Math.max(...dates.map(d => d.getTime())));
  min.setDate(min.getDate() - 2);
  max.setDate(max.getDate() + 2);
  return {start:min, end:max};
}

function buildTicks(start, end) {
  const ticks = [];
  const cur = new Date(start);
  while (cur <= end) {
    ticks.push(new Date(cur));
    cur.setDate(cur.getDate() + 7);
  }
  return ticks;
}

function hoursCell(task) {
  const est = Number(task.estimatedHours || 0);
  const log = Number(task.loggedHours || 0);
  const ratio = est > 0 ? Math.min((log / est) * 100, 100) : 0;
  const barColor = log > est ? "#f0883e" : "#3fb950";
  return `<div style="display:flex;align-items:center;gap:6px;min-width:130px"><div style="flex:1;background:#21262d;border-radius:3px;height:7px;min-width:60px"><div style="width:${ratio}%;height:100%;background:${barColor};border-radius:3px"></div></div><span style="font-size:10px;white-space:nowrap">${log}h / ${est}h</span></div>`;
}

function dateCell(task) {
  const plan = task.planStart && task.planEnd ? `${task.planStart}-${task.planEnd}` : "-";
  const actual = task.actualStart && task.actualEnd ? `${task.actualStart}-${task.actualEnd}` : "";
  if (!actual) return `<span style="font-size:10px;color:#8b949e">${plan}</span>`;
  return `<span style="font-size:10px;color:#8b949e">${plan}</span><br><span style="font-size:9px;color:#388bfd" title="date reali worklog">reale ${actual}</span>`;
}

function render(data) {
  const meta = data.meta || {};
  const sections = data.sections || [];
  const allTasks = sections.flatMap(s => s.tasks || []);
  const year = Number((meta.deadline || "").slice(-4)) || new Date().getFullYear();
  const today = parseDateDDMM(meta.today, year) || new Date();
  const range = collectRange(allTasks, year, today);
  const ticks = buildTicks(range.start, range.end);

  document.getElementById("title").textContent = (meta.title || "SPQM-1 - Query Manager per Service Desk").replace(/\?/g, "-");

  const deadline = meta.deadline || "-";
  const be = meta.beDeadline || "-";
  const fe = meta.feDeadline || "-";
  const oggi = `${String(today.getDate()).padStart(2,"0")}/${String(today.getMonth()+1).padStart(2,"0")}/${today.getFullYear()}`;
  document.getElementById("subtitle").innerHTML = `Fine prevista: <strong>${deadline}</strong> &nbsp;|&nbsp; BE: ${be} &nbsp;|&nbsp; FE: ${fe} &nbsp;|&nbsp; Oggi: ${oggi}`;

  const counts = kpi(allTasks);
  document.getElementById("kpi").innerHTML = `
    <div class="card"><b class="ok">${counts.done}</b>Fatto</div>
    <div class="card"><b class="pr">${counts.prog}</b>In corso</div>
    <div class="card"><b class="td">${counts.todo}</b>Da completare</div>
    <div class="card"><b style="color:#f0883e">${counts.total}</b>Totale</div>`;

  const content = document.getElementById("content");
  content.innerHTML = "";

  for (const section of sections) {
    const sec = document.createElement("div");
    sec.className = "sec";
    const sectionTitle = `${(section.name || "").replace(/\?/g, "-")} - ${section.owner || ""}`.trim().replace(/\s+-\s*$/, "");

    const headerTicks = ticks.map(t => {
      const left = pct(t, range.start, range.end);
      return `<span style="left:${left.toFixed(2)}%">${fmtDate(t)}</span>`;
    }).join("");

    let rows = "";
    for (const task of section.tasks || []) {
      const ps = parseDateDDMM(task.planStart, year);
      const pe = parseDateDDMM(task.planEnd, year);
      const as = parseDateDDMM(task.actualStart, year);
      const ae = parseDateDDMM(task.actualEnd, year);
      const left = ps ? pct(ps, range.start, range.end) : 0;
      const right = pe ? pct(pe, range.start, range.end) : left + 0.5;
      const width = Math.max(0.5, right - left);
      const aLeft = as ? pct(as, range.start, range.end) : left;
      const aRight = ae ? pct(ae, range.start, range.end) : aLeft;
      const aWidth = ae ? Math.max(0.5, aRight - aLeft) : 0;
      const todayX = pct(today, range.start, range.end);
      const rem = Number(task.remainingHours || 0);
      const remLabel = rem === 0 ? "0h ✓" : `${rem}h`;
      const remColor = rem === 0 ? "#3fb950" : "#8b949e";
      rows += `<tr>
        <td><a href="${task.jira || '#'}" target="_blank" rel="noopener">${task.ticket || ""}</a></td>
        <td class="tname" title="${task.task || ""}">${task.task || ""}</td>
        <td class="town">${task.owner || ""}</td>
        <td><span class="badge ${statusBadge(task.status)}">${task.status || "Da completare"}</span></td>
        <td>${hoursCell(task)}</td>
        <td class="tdate">${dateCell(task)}</td>
        <td style="font-size:11px;text-align:center;color:${remColor};vertical-align:middle">${remLabel}</td>
        <td class="barcell">
          <div class="track">
            <div class="today-inner" style="left:${todayX.toFixed(2)}%"></div>
            <div class="bar planned" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%;background:${statusColor(task.status)}"></div>
            ${aWidth > 0 ? `<div class="wl-bar" style="left:${aLeft.toFixed(2)}%;width:${aWidth.toFixed(2)}%"></div>` : ""}
          </div>
        </td>
      </tr>`;
    }

    sec.innerHTML = `
      <div class="sct">${sectionTitle}</div>
      <table>
        <thead>
          <tr>
            <th style="width:75px">Ticket</th>
            <th style="width:240px">Task</th>
            <th style="width:120px">Owner</th>
            <th style="width:90px">Stato</th>
            <th style="width:150px">Stimato vs Registrato</th>
            <th style="width:120px">Date piano / reale</th>
            <th style="width:80px;text-align:center">Rimanente</th>
            <th><div class="tick-header">${headerTicks}</div></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
    content.appendChild(sec);
  }
}

async function loadAndRender(showError = true) {
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, {cache:"no-store"});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    render(data);
    document.getElementById("warn").style.display = "none";
  } catch (err) {
    if (showError) {
      const w = document.getElementById("warn");
      w.style.display = "block";
      w.textContent = `Errore caricamento dati: ${err.message}`;
    }
  }
}

loadAndRender(true);
setInterval(() => loadAndRender(false), 10 * 60 * 1000);
</script>
</body>
</html>
